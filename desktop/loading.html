<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДЭ-2027</title>
  <style>
    :root {
      --bg: #17191b;
      --cream: #f2efe7;
      --muted: #9ba09c;
      --accent: #d9480f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 1px 1px, rgba(242, 239, 231, .07) 1px, transparent 0) 0 0 / 22px 22px,
        var(--bg);
      color: var(--cream);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .card { width: min(520px, calc(100% - 40px)); }
    .brand { display: flex; align-items: center; gap: 14px; }
    .mark {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      background: var(--accent);
      color: #fff;
      font: 600 22px/1 "Arial Narrow", Arial, sans-serif;
      letter-spacing: .02em;
    }
    .brand strong {
      display: block;
      font: 600 26px/1.1 "Arial Narrow", Arial, sans-serif;
      letter-spacing: .04em;
    }
    .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    h1 {
      margin: 34px 0 10px;
      font: 600 34px/1.05 "Arial Narrow", Arial, sans-serif;
    }
    p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .bar {
      margin-top: 26px;
      height: 4px;
      background: #34383b;
      overflow: hidden;
    }
    .bar i {
      display: block;
      width: 40%;
      height: 100%;
      background: var(--accent);
      animation: run 1.2s ease-in-out infinite;
    }
    @keyframes run {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark">ДЭ</span>
      <span>
        <strong>ДЭ-2027</strong>
        <span>платформа подготовки к демоэкзамену</span>
      </span>
    </div>

    <h1>Запускаю платформу</h1>
    <p>Поднимаю встроенный PHP, базу SQLite и уроки. Обычно это занимает несколько секунд.</p>
    <div class="bar"><i></i></div>
  </main>
</body>
</html>
